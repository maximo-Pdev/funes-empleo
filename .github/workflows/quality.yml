name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:tooling
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
      - name: Start isolated local Supabase
        run: npx supabase start > /dev/null
      - name: Build and run every private journey (no skips)
        run: npm run test:e2e:full
      - name: Stop local services
        if: always()
        run: npx supabase stop --no-backup

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Start isolated local Supabase
        run: npx supabase start > /dev/null
      - run: npm run test:db
      - name: Stop local services
        if: always()
        run: npx supabase stop --no-backup
